<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PH 43 GV</title>
<!-- Icons used when a neighbor adds this page to the home screen (iPhone: apple-touch-icon; Android: manifest). -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A4443">
<meta name="apple-mobile-web-app-title" content="PH 43 GV">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #1A4443; color: #fff; font-family: Jost, 'Century Gothic', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  h1 { font-weight: 300; font-size: 34px; margin: 18px 0 6px; letter-spacing: 1px; }
  p { color: #C9D8D5; margin: 0 0 22px; max-width: 30em; line-height: 1.45; }
  a.btn { background: #fff; color: #1A4443; text-decoration: none; font-weight: 500; font-size: 18px; border-radius: 10px; padding: 14px 26px; }
  .install { display: none; background: rgba(255,255,255,.08); border-radius: 12px; padding: 14px 18px; margin-top: 26px; max-width: 30em; text-align: left; font-size: 15px; line-height: 1.5; }
  .install b { color: #fff; }
  body.installing .install { display: block; }
  body.installing #auto { display: none; }
  /* The app runs full screen inside this page, so its login can be kept here (see the script). */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
  <img src="apple-touch-icon.png" alt="PH 43 GV">
  <h1>PH 43 GV</h1>
  <p id="auto">Abriendo el directorio de propietarios…</p>
  <a class="btn" id="open" href="#">Abrir el directorio</a>
  <div class="install">
    <b>Agregar a la pantalla de inicio</b><br>
    <b>iPhone (Safari):</b> toque Compartir (cuadrado con flecha) → "Agregar a pantalla de inicio" → "Agregar".<br>
    <b>Android (Chrome):</b> toque ⋮ → "Agregar a la pantalla principal" → "Agregar".
  </div>
<script>
  // The only place to change if the web app link ever changes.
  var APP_URL = 'https://script.google.com/macros/s/AKfycby1JZqZufKCc9c8nVM_0vLDPRpFjWFpF-aSxXq3Q0LpcJ9WD6uVZJl5Bfls_sRdA8aP-Q/exec';
  document.getElementById('open').href = APP_URL;
  if (location.hash === '#instalar') {
    // Install mode: stay here so the page can be added to the home screen, and drop the "#instalar"
    // so the saved icon opens the plain address, which redirects straight to the directory.
    document.body.className = 'installing';
    history.replaceState(null, '', location.pathname);
  } else if (window.top !== window.self) {
    // Framed by another page: never show the app here (clickjacking). Offer the real page instead.
    document.getElementById('open').target = '_top';
    document.getElementById('auto').textContent = 'Abra el directorio en su propia ventana.';
  } else {
    // Safari forgets storage inside Google's frame on every restart, so the app hands its login token
    // to this page, whose storage the browser keeps. Only the app's frame inside our iframe is answered.
    var KEY = 'ph_token';
    var frame = document.createElement('iframe');
    frame.id = 'app';
    frame.title = 'PH 43 GV';
    var fromApp = function (e) {
      if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return false;
      for (var w = e.source, i = 0; w && i < 5; i++) { if (w === frame.contentWindow) return true; if (w === w.parent) break; w = w.parent; }
      return false;
    };
    var store = function (fn) { try { return fn(window.localStorage); } catch (err) { return null; } };
    var readToken = function () { return store(function (s) { return s.getItem(KEY); }) || ''; };

    // Device key (see checkProof_ in Code.gs): kept here as a non-extractable key next to the token.
    // The app sends the secret once; afterwards this page only returns signatures, never the key.
    var CAN_KEY = !!(window.crypto && crypto.subtle && window.indexedDB && window.TextEncoder);
    var idb = function (fn) {
      return new Promise(function (res, rej) {
        var open = indexedDB.open('ph', 1);
        open.onupgradeneeded = function () { open.result.createObjectStore('k'); };
        open.onerror = function () { rej(open.error); };
        open.onsuccess = function () {
          var db = open.result, tx = db.transaction('k', 'readwrite'), r = fn(tx.objectStore('k'));
          tx.oncomplete = function () { db.close(); res(r && r.result); };
          tx.onerror = tx.onabort = function () { db.close(); rej(tx.error || new Error('idb')); };
        };
      });
    };
    var importKey = function (raw) { return crypto.subtle.importKey('raw', raw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']); };
    var fromB64 = function (t) { var b = atob(t), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
    var toB64 = function (buf) { var a = new Uint8Array(buf), t = ''; for (var i = 0; i < a.length; i++) t += String.fromCharCode(a[i]); return btoa(t); };
    // Store and read back a throwaway key first: a session is never bound to a key this browser cannot keep.
    var keyCheck = !CAN_KEY ? Promise.resolve(false) : importKey(crypto.getRandomValues(new Uint8Array(32)))
      .then(function (k) { return idb(function (st) { return st.put(k, 'test'); }); })
      .then(function () { return idb(function (st) { return st.get('test'); }); })
      .then(function (k) { return idb(function (st) { return st.delete('test'); }).then(function () { return !!k && k.type === 'secret'; }); })
      .catch(function () { return false; });
    var getKey = function () { return CAN_KEY ? idb(function (st) { return st.get('device'); }).catch(function () { return null; }) : Promise.resolve(null); };
    var dropKey = function () { return CAN_KEY ? idb(function (st) { return st.delete('device'); }).catch(function () {}) : Promise.resolve(); };
    var OK = function () { return { ok: true }; };

    var handle = function (d) {
      if (d.ph === 'get') return Promise.all([keyCheck, getKey()]).then(function (v) {
        return { ph: 'token', token: readToken(), key: !!v[1], canKey: v[0] };
      });
      if (d.ph === 'set' && /^[0-9a-f]{64}$/i.test(String(d.token))) {
        var same = readToken() === d.token;
        store(function (s) { s.setItem(KEY, d.token); });
        return (same ? Promise.resolve() : dropKey()).then(OK);  // a new session never reuses the old key
      }
      if (d.ph === 'del') { store(function (s) { s.removeItem(KEY); }); return dropKey().then(OK); }
      if (d.ph === 'bind' && CAN_KEY && typeof d.secret === 'string' && /^[A-Za-z0-9+\/]{43}=$/.test(d.secret)) {
        return importKey(fromB64(d.secret)).then(function (k) { return idb(function (st) { return st.put(k, 'device'); }); }).then(OK);
      }
      if (d.ph === 'sign' && typeof d.msg === 'string' && /^\d{10,16}\.[A-Za-z]{1,40}$/.test(d.msg)) {
        return getKey().then(function (k) {
          return k ? crypto.subtle.sign('HMAC', k, new TextEncoder().encode(d.msg)).then(function (sig) { return { sig: toB64(sig) }; }) : {};
        });
      }
      return Promise.resolve({});
    };
    // One message at a time, in order: a "set" or "del" is finished before the next "get" or "sign".
    var queue = Promise.resolve();
    window.addEventListener('message', function (e) {
      if (!e.data || typeof e.data.ph !== 'string' || !fromApp(e)) return;
      var d = e.data, src = e.source, origin = e.origin;
      queue = queue.then(function () { return handle(d); })
        .catch(function () { return { ok: false }; })
        .then(function (r) { r.n = d.n; src.postMessage(r, origin); });
    });
    frame.src = APP_URL;
    document.body.appendChild(frame);
  }
</script>
</body>
</html>
