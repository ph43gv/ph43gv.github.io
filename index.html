<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PH 43 GV</title>
<!-- Icons used when a neighbor adds this page to the home screen (iPhone: apple-touch-icon; Android: manifest). -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A4443">
<meta name="apple-mobile-web-app-title" content="PH 43 GV">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #1A4443; color: #fff; font-family: Jost, 'Century Gothic', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  h1 { font-weight: 300; font-size: 34px; margin: 18px 0 6px; letter-spacing: 1px; }
  p { color: #C9D8D5; margin: 0 0 22px; max-width: 30em; line-height: 1.45; }
  a.btn { background: #fff; color: #1A4443; text-decoration: none; font-weight: 500; font-size: 18px; border-radius: 10px; padding: 14px 26px; }
  .install { display: none; background: rgba(255,255,255,.08); border-radius: 12px; padding: 14px 18px; margin-top: 26px; max-width: 30em; text-align: left; font-size: 15px; line-height: 1.5; }
  .install b { color: #fff; }
  body.installing .install { display: block; }
  body.installing #auto { display: none; }
</style>
</head>
<body>
  <img src="apple-touch-icon.png" alt="PH 43 GV">
  <h1>PH 43 GV</h1>
  <p id="auto">Abriendo el directorio de propietarios…</p>
  <a class="btn" id="open" href="#">Abrir el directorio</a>
  <div class="install">
    <b>Agregar a la pantalla de inicio</b><br>
    <b>iPhone (Safari):</b> toque Compartir (cuadrado con flecha) → "Agregar a pantalla de inicio" → "Agregar".<br>
    <b>Android (Chrome):</b> toque ⋮ → "Agregar a la pantalla principal" → "Agregar".
  </div>
<script>
  // The only place to change if the web app link ever changes.
  var APP_URL = 'https://script.google.com/macros/s/AKfycby1JZqZufKCc9c8nVM_0vLDPRpFjWFpF-aSxXq3Q0LpcJ9WD6uVZJl5Bfls_sRdA8aP-Q/exec';
  document.getElementById('open').href = APP_URL;
  if (location.hash === '#instalar') {
    // Install mode: stay here so the page can be added to the home screen, and drop the "#instalar"
    // so the saved icon opens the plain address, which redirects straight to the directory.
    document.body.className = 'installing';
    history.replaceState(null, '', location.pathname);
  } else {
    location.replace(APP_URL);
  }
</script>
</body>
</html>
